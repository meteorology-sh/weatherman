services:
  weatherman-eval-service:
    build:
      context: ./eval
      dockerfile: Dockerfiles/Dockerfile.local
    command: ["node", "--watch", "server.mjs"]
    environment:
      WEATHERMAN_SERVER: http://weatherman-server-service:3000
    volumes:
      - ./eval:/usr/src/eval
    ports:
      - 3100:3100
  weatherman-eval-app-service:
    build:
      context: ./eval/app
      dockerfile: Dockerfiles/Dockerfile.local
    command: ["yarn", "run", "dev"]
    environment:
      EVAL_ORIGIN: http://weatherman-eval-service:3100
      SERVER_ORIGIN: http://weatherman-server-service:3000
    volumes:
      - ./eval/app:/usr/src/eval/app
      - /usr/src/eval/app/node_modules
      - ./app/src:/usr/src/app/src:ro
    ports:
      - 5174:5174
